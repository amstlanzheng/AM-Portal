# ============================================
# AM Portal 部署编排
#
# 中间件（MySQL / Redis / MinIO）均为外部已部署实例，
# 本文件不创建任何中间件容器；后端通过 host.docker.internal
# （或 .env.local 中配置的地址）连接。
#
# 端口约定（宿主机 → 容器）：
#   前端  ${WEB_PORT:-2887}   → 80
#   后端  ${BACKEND_PORT:-2888} → 8080
# ============================================

name: am-portal

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: am-portal-backend:latest
    container_name: am-backend
    restart: unless-stopped
    # 让容器可通过 host.docker.internal 访问宿主机上的外部中间件
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai

      # ---- MySQL（外部已部署实例）----
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-am_portal}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env.local 设置 MYSQL_PASSWORD}

      # ---- Redis（外部已部署实例）----
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env.local 设置 REDIS_PASSWORD}

      # ---- MinIO（外部已部署实例）----
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?请在 .env.local 设置 MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在 .env.local 设置 MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-am-portal}

      # ---- DeepSeek ----
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-2888}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - am-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: am-portal-frontend:latest
    container_name: am-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-2887}:8699"
    networks:
      - am-net

networks:
  am-net:
    driver: bridge
